[build-system]
requires = []
build-backend = "onyx_build_backend"
backend-path = ["."]

[project]
name = "bytecoin-onyx-sdk"
version = "1.1.0"
description = "Versioned offline bindings and wallet RPC codecs for Bytecoin Onyx ABI profile v1"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "LGPL-3.0-or-later"}
authors = [{name = "Bytecoin contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
]
