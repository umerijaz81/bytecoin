[package]
name = "onyx-zk"
version = "0.0.1"
edition = "2021"
publish = false
description = "Onyx (V6) zero-knowledge proof backend for Bytecoin — C ABI over a vendored Halo2/PLONKish (Pasta) stack. Wrappers only; no bespoke cryptography."
license = "LGPL-3.0-or-later"

[lib]
name = "onyx_zk"
# staticlib: linked into the C++ node/tests. rlib: lets `cargo test` exercise the Rust side.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pinned, vendored (cargo vendor) before mainnet use. These are the SAME primitives the protocol
# will use, so the test vectors below are authoritative.
halo2_proofs = "0.3"
halo2_gadgets = "0.5"
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"
rand = "0.8"

[profile.release]
opt-level = 3
