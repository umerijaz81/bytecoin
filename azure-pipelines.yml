# Legacy publisher intentionally disabled.
#
# The historical pipeline used retired hosted images, dead Bintray downloads, floating Git clones,
# unsupported OpenSSL 1.1.1b and an embedded long-lived GitHub PAT. It cannot produce release-grade
# artifacts. Reproducible source/SBOM/provenance evidence now lives in:
#   .github/workflows/release-evidence.yml
#   docs/Release-Readiness.md
#
# Keep this stub so an old Azure project cannot silently fall back to the unsafe definition.

trigger: none
pr: none

jobs:
  - job: LegacyReleaseDisabled
    displayName: Legacy release pipeline is disabled
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: none
      - script: |
          echo "This publisher is intentionally disabled. Use the reviewed release-evidence workflow."
          exit 1
        displayName: Refuse unsafe legacy release
