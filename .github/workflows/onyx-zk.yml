name: Onyx ZK backend

on:
  push:
    paths:
      - ".cargo/**"
      - ".github/workflows/onyx-zk.yml"
      - "rust-toolchain.toml"
      - "sdk/onyx/**"
      - "tests/onyx_compiler/**"
      - "tools/onyx/**"
      - "vendor/onyx-zk/**"
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/onyx-zk.yml"
      - "rust-toolchain.toml"
      - "sdk/onyx/**"
      - "tests/onyx_compiler/**"
      - "tools/onyx/**"
      - "vendor/onyx-zk/**"

permissions:
  contents: read

jobs:
  offline-tests:
    name: locked offline tests (${{ matrix.os }}, ${{ matrix.shard }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [core, transfer, programs, assets-wallet]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify formatting
        if: matrix.shard == 'core'
        run: cargo fmt --manifest-path vendor/onyx-zk/Cargo.toml -- --check
      - name: Test Python SDK binding
        if: matrix.shard == 'core'
        run: python -m unittest discover -s sdk/onyx/python -p "test_*.py"
      - name: Test JavaScript and TypeScript SDK binding
        if: matrix.shard == 'core'
        shell: bash
        run: node sdk/onyx/typescript/test.mjs
      - name: Build deterministic Onyx compiler Halo2 backend
        if: matrix.shard == 'core'
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo build --release --locked --offline
          --manifest-path vendor/onyx-zk/Cargo.toml
          --bin onyx-compiler-backend
      - name: Test deterministic Onyx compiler frontend and independent verifier
        if: matrix.shard == 'core'
        shell: bash
        run: |
          if [[ -x vendor/onyx-zk/target/release/onyx-compiler-backend.exe ]]; then
            export ONYX_COMPILER_BACKEND="$PWD/vendor/onyx-zk/target/release/onyx-compiler-backend.exe"
          else
            export ONYX_COMPILER_BACKEND="$PWD/vendor/onyx-zk/target/release/onyx-compiler-backend"
          fi
          python -m unittest discover -s tests/onyx_compiler -p "test_*.py"
      - name: Build versioned Python SDK wheel without network access
        if: matrix.shard == 'core'
        run: |
          python -m pip wheel --no-deps --no-build-isolation sdk/onyx/python -w build/onyx-sdk-wheel
          python -m pip wheel --no-deps --no-build-isolation sdk/onyx/python -w build/onyx-sdk-wheel-rebuild
      - name: Verify reproducible Python SDK wheel contents and metadata
        if: matrix.shard == 'core'
        run: python sdk/onyx/python/verify_wheel.py build/onyx-sdk-wheel build/onyx-sdk-wheel-rebuild
      - name: Build and verify reproducible TypeScript SDK packages
        if: matrix.shard == 'core'
        shell: bash
        env:
          npm_config_cache: build/npm-cache
        run: |
          python -c "from pathlib import Path; Path('build/onyx-ts-package').mkdir(parents=True, exist_ok=True); Path('build/onyx-ts-package-rebuild').mkdir(parents=True, exist_ok=True)"
          npm pack ./sdk/onyx/typescript --ignore-scripts --pack-destination build/onyx-ts-package
          npm pack ./sdk/onyx/typescript --ignore-scripts --pack-destination build/onyx-ts-package-rebuild
          python sdk/onyx/typescript/verify_package.py build/onyx-ts-package build/onyx-ts-package-rebuild
      - name: Test optimized proof shard without network access
        env:
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
        run: python tools/onyx/run_test_shard.py "${{ matrix.shard }}"
