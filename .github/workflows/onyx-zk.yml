name: Onyx ZK backend

on:
  push:
    paths:
      - ".cargo/**"
      - ".github/workflows/onyx-zk.yml"
      - "rust-toolchain.toml"
      - "sdk/onyx/**"
      - "tools/onyx/**"
      - "vendor/onyx-zk/**"
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/onyx-zk.yml"
      - "rust-toolchain.toml"
      - "sdk/onyx/**"
      - "tools/onyx/**"
      - "vendor/onyx-zk/**"

permissions:
  contents: read

jobs:
  offline-tests:
    name: locked offline tests (${{ matrix.os }}, ${{ matrix.shard }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [core, transfer, programs, assets-wallet]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify formatting
        if: matrix.shard == 'core'
        run: cargo fmt --manifest-path vendor/onyx-zk/Cargo.toml -- --check
      - name: Test Python SDK binding
        if: matrix.shard == 'core'
        run: python -m unittest discover -s sdk/onyx/python -p "test_*.py"
      - name: Build versioned Python SDK wheel without network access
        if: matrix.shard == 'core'
        run: python -m pip wheel --no-deps --no-build-isolation sdk/onyx/python -w build/onyx-sdk-wheel
      - name: Verify Python SDK wheel contents and metadata
        if: matrix.shard == 'core'
        run: python sdk/onyx/python/verify_wheel.py build/onyx-sdk-wheel
      - name: Test optimized proof shard without network access
        env:
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
        run: python tools/onyx/run_test_shard.py "${{ matrix.shard }}"
