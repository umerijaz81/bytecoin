name: RandomX backend

on:
  push:
    paths:
      - ".github/workflows/randomx.yml"
      - "src/crypto/RandomX.*"
      - "tests/hash/test_randomx.*"
      - "tests/randomx/**"
      - "vendor/randomx/**"
  pull_request:
    paths:
      - ".github/workflows/randomx.yml"
      - "src/crypto/RandomX.*"
      - "tests/hash/test_randomx.*"
      - "tests/randomx/**"
      - "vendor/randomx/**"

permissions:
  contents: read

jobs:
  upstream-v2-tests:
    name: v2 and full-memory tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: build-randomx/randomx-tests
            mode_executable: build-randomx-modes/randomx-mode-tests
          - os: macos-latest
            executable: build-randomx/randomx-tests
            mode_executable: build-randomx-modes/randomx-mode-tests
          - os: windows-latest
            executable: build-randomx/Release/randomx-tests.exe
            mode_executable: build-randomx-modes/Release/randomx-mode-tests.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure pinned RandomX
        run: cmake -S vendor/randomx -B build-randomx
      - name: Build upstream tests
        run: cmake --build build-randomx --config Release --target randomx-tests
      - name: Run RandomX v2 vectors
        shell: bash
        run: ./${{ matrix.executable }} --v2
      - name: Configure Bytecoin full-memory mode test
        run: cmake -S tests/randomx -B build-randomx-modes
      - name: Build Bytecoin full-memory mode test
        run: cmake --build build-randomx-modes --config Release --target randomx-mode-tests
      - name: Run light/full-memory equality and concurrency test
        shell: bash
        run: ./${{ matrix.mode_executable }}

  riscv64-v2-vectors:
    name: upstream v2 vectors (riscv64/QEMU)
    # GCC 14 added the ratified RISC-V vector-crypto intrinsic API used by
    # upstream RandomX. Ubuntu 26.04 supplies a new-enough cross compiler.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install RISC-V cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-riscv64-linux-gnu g++-riscv64-linux-gnu qemu-user
          riscv64-linux-gnu-g++ --version
      - name: Configure pinned RandomX for RV64GC
        run: >-
          cmake -S vendor/randomx -B build-randomx-riscv64
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=riscv64
          -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++
      - name: Build RISC-V upstream tests
        run: cmake --build build-randomx-riscv64 --parallel 2 --target randomx-tests
      - name: Run RandomX v2 vectors under QEMU
        run: qemu-riscv64 -L /usr/riscv64-linux-gnu build-randomx-riscv64/randomx-tests --v2
