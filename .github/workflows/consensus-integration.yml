name: Consensus integration

on:
  push:
    paths:
      - ".github/workflows/consensus-integration.yml"
      - "CMakeLists.txt"
      - "src/CryptoNote.*"
      - "src/Core/BlockChain*"
      - "src/Core/Currency.*"
      - "src/Core/Config.*"
      - "src/Core/Node*"
      - "src/common/Ipv4Address.*"
      - "src/common/StringTools.*"
      - "src/crypto/RandomX.*"
      - "src/p2p/**"
      - "src/main_miner.cpp"
      - "src/main_walletd.cpp"
      - "tests/blockchain/**"
      - "tests/miner/**"
      - "tests/network/**"
      - "tests/security/**"
      - "vendor/randomx/**"
  pull_request:
    paths:
      - ".github/workflows/consensus-integration.yml"
      - "CMakeLists.txt"
      - "src/CryptoNote.*"
      - "src/Core/BlockChain*"
      - "src/Core/Currency.*"
      - "src/Core/Config.*"
      - "src/Core/Node*"
      - "src/common/Ipv4Address.*"
      - "src/crypto/RandomX.*"
      - "src/p2p/**"
      - "src/main_miner.cpp"
      - "tests/blockchain/**"
      - "tests/miner/**"
      - "tests/network/**"
      - "vendor/randomx/**"

permissions:
  contents: read

jobs:
  randomx-reorg:
    name: RandomX epoch reorg (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libboost-dev libssl-dev libudev-dev
      - name: Configure consensus tests
        run: cmake -S . -B build-consensus -DUSE_SQLITE=ON -DONYX_ZK=OFF
      - name: Build consensus tests
        run: cmake --build build-consensus --parallel 2 --target tests minerd bytecoind bytecoind-v4-test-fixture walletd
      - name: Smoke-test miner command line
        working-directory: build-consensus
        run: ../bin/minerd --help
      - name: Reject corrupt mining templates without hashing or submission
        run: >-
          python3 tests/miner/test_corrupt_template_process.py
          --minerd bin/minerd
          --bytecoind bin/bytecoind
      - name: Enforce HTTP request and connection resource limits
        run: python3 tests/http/test_http_limits_process.py --bytecoind bin/bytecoind
      - name: Enforce wallet authentication secret handling
        run: python3 tests/security/test_wallet_auth_process.py --walletd bin/walletd
      - name: Exclude hardware emulator from release-capable walletd
        run: python3 tests/security/test_release_emulator_absence.py --walletd bin/walletd
      - name: Qualify Dandelion relay across real daemon sockets
        run: >-
          python3 tests/network/test_dandelion_process.py
          --bytecoind bin/bytecoind
          --v4-bytecoind bin/bytecoind-v4-test-fixture
          --walletd bin/walletd
          --minerd bin/minerd
      - name: Run blockchain and RandomX reorganization tests
        working-directory: build-consensus
        run: ../bin/tests --blockchain
