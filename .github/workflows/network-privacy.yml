name: Network privacy policies

on:
  push:
    paths:
      - ".github/workflows/network-privacy.yml"
      - "src/common/Ipv4Address.*"
      - "src/Core/Config.*"
      - "src/Core/Node*"
      - "src/p2p/**"
      - "tests/network/**"
  pull_request:
    paths:
      - ".github/workflows/network-privacy.yml"
      - "src/common/Ipv4Address.*"
      - "src/Core/Config.*"
      - "src/Core/Node*"
      - "src/p2p/**"
      - "tests/network/**"

permissions:
  contents: read

jobs:
  policy-tests:
    name: policy tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: build-network-privacy/network-privacy-tests
          - os: macos-latest
            executable: build-network-privacy/network-privacy-tests
          - os: windows-latest
            executable: build-network-privacy/Release/network-privacy-tests.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure policy tests
        run: cmake -S tests/network -B build-network-privacy
      - name: Build policy tests
        run: cmake --build build-network-privacy --config Release
      - name: Run adversarial policy tests
        shell: bash
        run: ./${{ matrix.executable }}

  process-proxy-tests:
    name: bytecoind SOCKS5 process and leak tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install daemon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libboost-dev libssl-dev libudev-dev
      - name: Build the real daemon and DNS tripwire
        run: |
          cmake -S . -B build-network-process -DUSE_SQLITE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-network-process --target bytecoind --parallel 2
          cc -shared -fPIC -Wall -Wextra -Werror tests/network/dns_guard.c \
            -o build-network-process/dns_guard.so -ldl
      - name: Run process-level SOCKS5 and leak qualification
        run: |
          python3 tests/network/test_proxy_process.py \
            --bytecoind bin/bytecoind \
            --dns-guard build-network-process/dns_guard.so
