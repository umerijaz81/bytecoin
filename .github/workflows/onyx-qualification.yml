name: Onyx sustained qualification

on:
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-state-campaign:
    name: deterministic state differential campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run retained multi-seed state campaign
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          python3 tools/onyx/state_model_campaign.py
          --steps 2000
          --timeout-per-seed 180
          --max-seed-cpu-seconds 120
          --max-seed-rss-mib 1024
          --max-seed-output-mib 2
          --revision "${{ github.sha }}"
          --report build/onyx-qualification/state-model.json
      - name: Decode and re-encode exact configured snapshot limits
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          python3 tools/onyx/snapshot_limit_campaign.py
          --timeout-per-case 180
          --sample-interval 0.02
          --max-case-cpu-seconds 60
          --max-case-rss-mib 1024
          --max-case-output-mib 2
          --revision "${{ github.sha }}"
          --report build/onyx-qualification/snapshot-limit.json
      - name: Run seeded structured snapshot corruption campaign
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          python3 tools/onyx/snapshot_corruption_campaign.py
          --cases 20000
          --timeout-per-seed 180
          --max-seed-cpu-seconds 150
          --max-seed-rss-mib 1024
          --max-seed-output-mib 2
          --revision "${{ github.sha }}"
          --report build/onyx-qualification/snapshot-corruption.json
      - name: Upload campaign identity and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onyx-state-model-${{ github.sha }}
          path: |
            build/onyx-qualification/state-model.json
            build/onyx-qualification/state-model-build.log
            build/onyx-qualification/state-model-seed-*.log
            build/onyx-qualification/snapshot-limit.json
            build/onyx-qualification/snapshot-limit-*.log
            build/onyx-qualification/snapshot-corruption.json
            build/onyx-qualification/snapshot-corruption-*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  structured-compiler-fuzz:
    name: structured compiler fuzz (${{ matrix.seed }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: ["0x4f4e5958", "0x91a75eed", "0xc0dec0de", "0xf00d1234"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build locked compiler backend
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo build --release --locked --offline
          --manifest-path vendor/onyx-zk/Cargo.toml
          --bin onyx-compiler-backend
      - name: Run deterministic grammar-directed differential campaign
        run: |
          python3 tools/onyx/structured_fuzz_v1.py \
            --cases 10000 \
            --seed "${{ matrix.seed }}" \
            --backend vendor/onyx-zk/target/release/onyx-compiler-backend \
            --backend-cases 32 \
            --report "build/onyx-qualification/structured-${{ matrix.seed }}.json"
      - name: Upload campaign identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onyx-structured-fuzz-${{ matrix.seed }}-${{ github.sha }}
          path: build/onyx-qualification/structured-${{ matrix.seed }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  pinned-standard-artifacts:
    name: reproduce pinned standard artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build locked compiler backend
        env:
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo build --release --locked --offline
          --manifest-path vendor/onyx-zk/Cargo.toml
          --bin onyx-compiler-backend
      - name: Independently reproduce all standard descriptors
        run: >-
          python3 tools/onyx/verify_standard_program_artifacts_v1.py
          --backend-executable vendor/onyx-zk/target/release/onyx-compiler-backend

  verifier-valid-proof-load:
    name: valid-proof verifier load and liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libboost-dev libssl-dev libudev-dev
      - name: Configure locked ZK-enabled load binaries
        run: >-
          cmake -S . -B build-onyx-load
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_SQLITE=ON
          -DONYX_ZK=ON
          -DONYX_CRASH_TESTS=ON
      - name: Build load node, wallet, miner, and tests
        run: >-
          cmake --build build-onyx-load --parallel 2
          --target bytecoind walletd minerd tests
      - name: Exercise SQLite Onyx state/undo crash boundaries
        run: >-
          python3 tests/network/test_onyx_db_crash_process.py
          --tests build-onyx-load/artifacts/bin/tests
          --revision "${{ github.sha }}"
          --report build-onyx-load/onyx-db-crash-process.json
      - name: Exercise corrupt SQLite image and rollback-journal recovery
        run: >-
          python3 tests/network/test_onyx_db_corruption_process.py
          --tests build-onyx-load/artifacts/bin/tests
          --revision "${{ github.sha }}"
          --report build-onyx-load/onyx-db-corruption-process.json
      - name: Exercise SQLite WAL corruption and checkpoint bundle recovery
        run: >-
          python3 tests/network/test_onyx_db_wal_process.py
          --tests build-onyx-load/artifacts/bin/tests
          --revision "${{ github.sha }}"
          --report build-onyx-load/onyx-db-wal-process.json
      - name: Exercise atomic SQLite disk-full recovery
        run: >-
          python3 tests/network/test_onyx_db_full_process.py
          --tests build-onyx-load/artifacts/bin/tests
          --revision "${{ github.sha }}"
          --report build-onyx-load/onyx-db-full-process.json
      - name: Exercise test-only SQLite write and sync I/O faults
        run: >-
          python3 tests/network/test_onyx_db_ioerr_process.py
          --tests build-onyx-load/artifacts/bin/tests
          --revision "${{ github.sha }}"
          --report build-onyx-load/onyx-db-ioerr-process.json
      - name: Exercise full-daemon Onyx apply and reorganization crash boundaries
        run: >-
          python3 tests/network/test_onyx_daemon_crash_process.py
          --bytecoind build-onyx-load/artifacts/bin/bytecoind
          --walletd build-onyx-load/artifacts/bin/walletd
          --minerd build-onyx-load/artifacts/bin/minerd
          --revision "${{ github.sha }}"
          --report build-onyx-load/onyx-daemon-crash-process.json
      - name: Run real valid-proof concurrency and post-load progress qualification
        run: >-
          python3 tests/network/test_onyx_verifier_load_process.py
          --bytecoind build-onyx-load/artifacts/bin/bytecoind
          --walletd build-onyx-load/artifacts/bin/walletd
          --minerd build-onyx-load/artifacts/bin/minerd
          --revision "${{ github.sha }}"
          --report build-onyx-load/onyx-verifier-load-process.json
      - name: Upload non-release verifier load reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onyx-verifier-load-${{ github.sha }}
          path: |
            build-onyx-load/onyx-verifier-load-process*.json
            build-onyx-load/onyx-db-crash-process.json
            build-onyx-load/onyx-db-corruption-process.json
            build-onyx-load/onyx-db-wal-process.json
            build-onyx-load/onyx-db-full-process.json
            build-onyx-load/onyx-db-ioerr-process.json
            build-onyx-load/onyx-daemon-crash-process.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
